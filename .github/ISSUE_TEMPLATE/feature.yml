name: 功能建议
description: 想要的新能力或改进
labels: [enhancement]
body:
  - type: input
    id: what
    attributes:
      label: 想要什么
      placeholder: 一句话说明
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: 解决什么问题
      description: 描述你现在怎么绕过去的、痛点在哪
    validations:
      required: true
  - type: textarea
    id: how
    attributes:
      label: 你设想的做法（可选）
      description: 比如加在哪个页签、需要什么参数、能不能用现有接口拼出来
  - type: dropdown
    id: area
    attributes:
      label: 涉及功能
      options:
        - 说话
        - 翻唱
        - 导入 / 导出
        - Aurabot 联动
        - 界面
        - 其他
