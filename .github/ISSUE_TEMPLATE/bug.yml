name: Bug 反馈
description: 报告一个可以复现的问题
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。请尽量填全，尤其是环境自检与日志，能大幅缩短定位时间。
  - type: input
    id: version
    attributes:
      label: 插件版本
      description: 面板右下角或 设置 → 系统 里的版本号（BUILD 那一行）
      placeholder: 例如 2026-10-28 22:10 (v2.6)
    validations:
      required: true
  - type: input
    id: dsh
    attributes:
      label: DSH 版本 / 系统
      placeholder: 例如 DSH 1.x，Windows 11 23H2
    validations:
      required: true
  - type: input
    id: gpu
    attributes:
      label: 显卡与显存
      placeholder: 例如 RTX 4050 Laptop 6GB
  - type: dropdown
    id: area
    attributes:
      label: 出问题的功能
      options:
        - 说话（试听 / 切换 / 训练）
        - 翻唱（分离 / 变声 / 混音）
        - 导入 / 导出
        - 同步到 Aurabot
        - 环境自检 / 引擎启动
        - 界面
        - 其他
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 打开 设置 → 翻唱引擎
        2. 点 导入 .pth
        3. 报错 ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望结果 vs 实际结果
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 日志 / 截图
      description: 设置 → 系统 → 生成诊断包，把生成的 json 拖进来；或粘贴报错文本
      render: text
  - type: checkboxes
    id: confirm
    attributes:
      label: 确认
      options:
        - label: 我已经重启过 DSH，并刷新过面板（F5）
          required: true
        - label: 我确认使用的音色素材有权使用
          required: false
